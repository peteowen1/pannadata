name: Repair opta_events substitutions (R196)

# Manual dispatch only, one-off. Rebuilds the substitution rows the old
# scraper re-save key collapsed (every sub in the same minute of a match
# became one row) from the raw per-competition events_<comp>.parquet, and
# drops the 0:00 placeholder copies of subs. No Opta API calls. Rules and
# measurements: scripts/opta/repair_lost_subs.py and pannaverse
# docs/backlog/REVIEW-TRIAGE-2026-10-11.md (R196).
#
# dry_run defaults to TRUE: it prints the counts and uploads nothing. Same
# concurrency group as the daily scrape, so the two never write opta-latest at
# once; the daily scrape restores the repaired opta_events and appends to it.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the repair counts only; upload nothing'
        required: false
        type: boolean
        default: true

concurrency:
  group: opta-latest-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout pannadata
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/opta/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/opta/requirements.txt

      - name: Restore opta_events, lineups and raw events
        run: |
          set -euo pipefail
          source scripts/versebus.sh
          mkdir -p data/in data/raw
          VB_SH_ASSETS_JSON=$(vb_sh_list_assets peteowen1/pannadata opta-latest)
          for f in opta_events.parquet opta_lineups.parquet; do
            vb_sh_restore peteowen1/pannadata opta-latest "$f" data/in \
              || { echo "::error::could not restore $f"; exit 1; }
          done
          n=0
          for f in $(jq -r '.[].name | select(test("^events_.*\\.parquet$"))' <<<"$VB_SH_ASSETS_JSON"); do
            vb_sh_restore peteowen1/pannadata opta-latest "$f" data/raw \
              || { echo "::error::could not restore $f"; exit 1; }
            n=$((n + 1))
          done
          echo "restored $n raw events files"
          [ "$n" -gt 100 ] || { echo "::error::only $n raw events files; expected ~113"; exit 1; }

      - name: Repair
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail   # tee must not hide the script refusing
          ARGS="--events data/in/opta_events.parquet --raw-dir data/raw --lineups data/in/opta_lineups.parquet --out data/out/opta_events.parquet"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          mkdir -p data/out
          python scripts/opta/repair_lost_subs.py $ARGS | tee repair.log
          { echo '## opta_events substitution repair'; echo '```'; cat repair.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repaired opta_events + manifest
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          source scripts/versebus.sh
          f=data/out/opta_events.parquet
          [ -f "$f" ] || { echo "::error::repair wrote no file"; exit 1; }
          vb_sh_safe_upload peteowen1/pannadata opta-latest "$f"
          vb_sh_verify peteowen1/pannadata opta-latest "$f"
          vb_sh_manifest_last peteowen1/pannadata opta-latest 0 bus_manifest.json "$f"
